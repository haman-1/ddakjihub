<h2>강아지 임신·출산 날짜 계산기</h2>
<p class="calc-desc">교배일을 넣으면 출산 예정일과 출산 가능 기간, 주요 검사 시기를 계산합니다.</p>
<div class="calc-field">
  <label for="calc-mate">교배일</label>
  <input type="date" id="calc-mate">
</div>
<button type="button" id="calc-run" class="calc-btn">계산하기</button>
<p class="calc-msg" id="calc-msg" hidden></p>
<div class="calc-result" id="calc-result" hidden>
  <p class="calc-line">출산 예정일 <strong><span id="calc-due"></span></strong> <span class="calc-sub">(교배일 + 63일)</span></p>
  <p class="calc-line">출산 가능 기간 <span id="calc-window"></span> <span class="calc-sub">(교배일 + 58~68일)</span></p>
  <p class="calc-line">임신 확인 <span id="calc-check"></span> <span class="calc-sub">(초음파·릴락신 검사)</span></p>
  <p class="calc-line">X선 촬영 <span id="calc-xray"></span> <span class="calc-sub">(태아 마릿수 확인)</span></p>
  <p class="calc-line">체온 체크 시작 <span id="calc-temp"></span> <span class="calc-sub">(분만 임박 신호 확인)</span></p>
  <p class="calc-note">계산값은 교배일 기준입니다. 정확한 예정일은 수의사의 초음파·프로게스테론 검사로 확인하세요.</p>
</div>
