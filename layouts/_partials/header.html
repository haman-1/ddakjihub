<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="/">{{ site.Title }}</a>
    <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true">
    <nav class="site-nav" aria-label="주요 메뉴">
      {{- range site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{- end }}
    </nav>
    <a class="header-search" href="/search/" aria-label="글 검색">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
    </a>
    <label class="menu-button" for="menu-toggle" aria-label="카테고리 메뉴 열기/닫기">
      <svg class="icon-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg class="icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </label>
  </div>
</header>
