<h2>강아지 사료량 계산기</h2>
<p class="calc-desc">몸무게와 아이의 상태를 고르면 하루 필요 열량과 사료량(g)을 계산합니다.</p>
<div class="calc-field">
  <label for="calc-weight">몸무게</label>
  <input type="number" id="calc-weight" min="0.1" max="100" step="0.1" inputmode="decimal" placeholder="예: 5.2">
  <span>kg</span>
</div>
<div class="calc-field">
  <label for="calc-status">아이의 상태</label>
  <select id="calc-status">
    <option value="3">성장기 · 생후 4개월 미만</option>
    <option value="2">성장기 · 4개월~성견 전</option>
    <option value="1.6" selected>성견 · 중성화함</option>
    <option value="1.8">성견 · 중성화 안 함</option>
    <option value="2">성견 · 운동 많은 편</option>
    <option value="1.4">실내 생활 위주 · 비만 경향</option>
    <option value="1">체중 감량 중 (목표 체중 기준)</option>
  </select>
</div>
<div class="calc-field">
  <label for="calc-kcal">사료 열량</label>
  <input type="number" id="calc-kcal" min="1" step="1" inputmode="decimal" placeholder="예: 3600">
  <select id="calc-unit">
    <option value="1000" selected>kcal/kg</option>
    <option value="100">kcal/100g</option>
  </select>
</div>
<button type="button" id="calc-run" class="calc-btn">계산하기</button>
<p class="calc-msg" id="calc-msg" hidden></p>
<div class="calc-result" id="calc-result" hidden>
  <p class="calc-line">하루 필요 열량 <strong><span id="calc-mer">0</span> kcal</strong> <span class="calc-sub">(안정시 <span id="calc-rer">0</span> kcal × 계수 <span id="calc-factor">1.6</span>)</span></p>
  <p class="calc-line" id="calc-grams-line" hidden>하루 사료량 <strong><span id="calc-grams">0</span> g</strong> <span class="calc-sub">(2끼로 나누면 한 끼 <span id="calc-per-meal">0</span> g)</span></p>
  <p class="calc-note">계산 결과는 추정치입니다. 2~4주 단위로 체중과 체형을 확인하며 조정하세요.</p>
</div>
